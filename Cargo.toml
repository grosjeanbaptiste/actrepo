[package]
name = "actrepo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs through actautoma"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "dfc9f80b91b2e4df1c6bd3a077385df765cd43cf" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "c0a47aa3d3b0f0bb5a011af08d1bc12a98526a6a" }
actautoma = { git = "https://github.com/grosjeanbaptiste/actautoma", rev = "37219d6bec4aeda761dfdd3d60ce3c1702054659" }
actdevice = { git = "ssh://git@github.com/grosjeanbaptiste/actdevice.git", rev = "f1cd0d3ebd116762f1eede169c193eba5d7ea5b2" }
actmake = { git = "ssh://git@github.com/grosjeanbaptiste/actmake.git", rev = "52fd2db6029a8a28186c0a8f095e5c456427de81" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
