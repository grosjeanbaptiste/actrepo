[package]
name = "repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs through actautoma"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "d25d5d09d0e8f23413669b751729b0b98c95aa63" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "516df332ab9171140bb08e60fa0a3d33d64e15a5" }
actautoma = { git = "https://github.com/grosjeanbaptiste/actautoma", rev = "dde05e0d29ad9feb7bcd4e56d8a76a3aab1ff067" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
