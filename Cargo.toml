[package]
name = "actrepo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs through actautoma"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "dfc9f80b91b2e4df1c6bd3a077385df765cd43cf" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "5b0269ba4ec2ff2af47cf25be66b9902e13cb5c0" }
actautoma = { git = "https://github.com/grosjeanbaptiste/actautoma", rev = "6b3239bf877cc234c52c5c1b99dda57e15974602" }
actdevice = { git = "ssh://git@github.com/grosjeanbaptiste/actdevice.git", rev = "f1cd0d3ebd116762f1eede169c193eba5d7ea5b2" }
actmake = { git = "ssh://git@github.com/grosjeanbaptiste/actmake.git", rev = "52fd2db6029a8a28186c0a8f095e5c456427de81" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
